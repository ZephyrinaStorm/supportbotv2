services:
  - type: worker
    name: jumpstart-trilogy-help-bot
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPPORT_CHANNEL_ID
        sync: false
      - key: FEEDBACK_CHANNEL_ID
        sync: false
